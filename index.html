<style>
  :root{
    --black:#111010;--red:#C8161D;--red-d:#a50f15;--red-soft:#fdeeee;
    --bg:#F6F4F2;--card:#fff;--grey:#6b6764;--line:#e7e2dd;--steam:#cfc8c2;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--black);font-family:Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  body::before{content:"";position:fixed;right:-120px;top:-140px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(200,22,29,.16),rgba(200,22,29,0) 70%);pointer-events:none;z-index:0}
  body::after{content:"";position:fixed;left:-140px;bottom:-160px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(17,16,16,.06),rgba(17,16,16,0) 70%);pointer-events:none;z-index:0}

  /* --- Нейрочайник --- */
  .kettle{display:block;overflow:visible}
  .kettle .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:100px 170px;transform-box:view-box}
  .kettle .eyes{animation:blink 5s infinite;transform-origin:100px 123px;transform-box:view-box}
  .kettle .puff{fill:var(--steam);opacity:0;transform-box:fill-box;transform-origin:center;animation:puff var(--sp,2.4s) ease-out infinite}
  .kettle .puff:nth-child(2){animation-delay:calc(var(--sp,2.4s)*.25)}
  .kettle .puff:nth-child(3){animation-delay:calc(var(--sp,2.4s)*.5)}
  .kettle .puff:nth-child(4){animation-delay:calc(var(--sp,2.4s)*.75)}
  .kettle[data-heat="0"] .puff{display:none}
  .kettle[data-heat="1"] .puff:nth-child(n+3){display:none}
  .kettle[data-heat="1"]{--sp:3.2s}
  .kettle[data-heat="2"]{--sp:2.1s}
  .kettle[data-heat="3"]{--sp:1.2s}
  .kettle[data-heat="3"] .bob{animation:whistle .35s ease-in-out infinite}
  .kettle .cheek{transition:opacity .4s}
  .kettle[data-heat="3"] .cheek{opacity:.9}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes whistle{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg) translateY(-2px)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  @keyframes puff{0%{transform:translate(0,0) scale(.35);opacity:0}15%{opacity:.95}100%{transform:translate(-14px,-70px) scale(1.5);opacity:0}}

  .hero{text-align:center;padding:6px 0 8px}
  .hero .kettle{width:210px;height:210px;margin:0 auto -6px}
  .bubble{position:relative;background:var(--card);border-radius:16px;padding:12px 16px;font-size:14.5px;line-height:1.45;box-shadow:var(--shadow);font-weight:500}

  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 22px}

       background:linear-gradient(135deg,#de2a31,var(--red) 55%,var(--red-d));box-shadow:0 8px 20px rgba(200,22,29,.28);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s,opacity .2s}
  .btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite}

  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.35;cursor:default;box-shadow:none}
  .btn:disabled::after{display:none}
  .btn .arr{transition:transform .2s}
  .btn:hover .arr{transform:translateX(4px)}
  .btn.ghost{background:var(--card);color:var(--black);box-shadow:var(--shadow);font-weight:600}
  .btn.ghost::after{display:none}
  @keyframes shine{0%,60%{left:-60%}100%{left:130%}}

  /* --- Экран вопроса --- */
  .qhead{display:flex;align-items:flex-end;gap:10px;margin:4px 0 16px}
  .qhead .kettle{width:86px;height:86px;flex:0 0 86px;margin-bottom:-4px}

  .opts{display:flex;flex-direction:column;gap:10px;margin:6px 0 20px}
  .opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid transparent;border-radius:16px;color:var(--black);padding:15px 14px;font:600 15.5px Manrope,sans-serif;line-height:1.3;cursor:pointer;box-shadow:var(--shadow);
       transition:transform .15s,box-shadow .15s,border-color .15s,background .15s;animation:rise .35s both;animation-delay:calc(var(--k)*45ms)}
  .opt:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
  .opt:active{transform:scale(.98)}
  .opt .n{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--red);background:var(--red-soft);border-radius:7px;padding:4px 7px;transition:background .15s,color .15s}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

  textarea,input[type=text]{width:100%;background:var(--card);border:1.5px solid transparent;border-radius:16px;box-shadow:var(--shadow);color:var(--black);padding:16px;font:500 16px Manrope,sans-serif;margin:6px 0 20px;resize:vertical;transition:border-color .15s}

  .card{background:var(--card);border-radius:20px;padding:22px 20px;margin:16px 0;box-shadow:var(--shadow);animation:rise .4s both}
  .card.accent{border:1.5px solid var(--red)}
  .card h3{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;margin-bottom:10px;line-height:1.1}
  .card ul{list-style:none}
  .card li{font-size:15px;line-height:1.5;padding:6px 0 6px 26px;position:relative}
  .card li::before{content:"✦";position:absolute;left:0;color:var(--red)}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
  .tags span{background:var(--red-soft);color:var(--red-d);font-size:13px;font-weight:700;padding:7px 11px;border-radius:999px}
  .steps{list-style:none;margin:12px 0 18px;counter-reset:s}

  .steps li::before{content:counter(s);left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .copied{font-size:14px;font-weight:600;color:#2f8a3f;margin-top:10px;min-height:20px;text-align:center}
  details{margin-top:12px}
  summary{cursor:pointer;font-size:14px;color:var(--grey);font-weight:600}
  pre{white-space:pre-wrap;font:13px/1.5 Manrope,sans-serif;color:#3b3836;background:var(--bg);padding:14px;margin-top:10px;border-radius:12px}
  .foot{margin-top:26px;text-align:center;font-size:12px;color:var(--grey);line-height:1.6}
  .foot a{color:var(--black);font-weight:700}
  .screen{animation:slide .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

   fit:['Сторис, посты и карусели с нейросетью','Монтаж Reels: паузы, субтитры, нарезка','Контент-план и рубрики — из одной идеи десятки роликов','Дайджест новостей нейросетей каждое утро']},
  {n:3, name:'Автоматизация', title:'Свистит!', heat:3,
   text:'Тебе уже мало отдельных запросов. Пора собрать агента, который сам работает с файлами, сервисами и публикациями.',
   fit:['Свой агент под задачи бизнеса','Подключение Telegram, таблиц и других сервисов','Сайт или лид-магнит — от создания до публикации','Автопубликация и задачи по расписанию']}
];

let i = -1, A = {};
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const head = () => `<div class="top"><div class="who"><img src="hero.jpg" alt=""><span><b>Антонина Алдатова</b>маркетолог-смысловик</span></div><span class="chip">нейро-тест</span></div>`;

function intro(){
  i = -1;
  app.innerHTML = `<div class="screen">${head()}
    <div class="hero">
      ${kettle(1)}
      <div class="bubble" style="display:inline-block;margin-bottom:18px">Привет! Я <b>Нейрочайник</b> — проверим, насколько ты уже кипишь?</div>
      <h1>Ты ещё <em>чайник</em><br>или уже свистишь?</h1>
      <div class="script" style="font-size:30px;margin:8px 0 14px">Тебе можно проще</div>
      <p class="lead">Ответь на 14 коротких вопросов и узнай свой уровень в нейросетях. А по твоим ответам я подберу программу именно для тебя.</p>
      <div class="facts"><span><i>✦</i>14 вопросов</span><span><i>✦</i>3 минуты</span><span><i>✦</i>программа под тебя</span></div>
    </div>
    <div class="levels">
      <div class="lv">${kettle(0)}<b>Уровень 1</b>Чайник только поставили</div>
      <div class="lv">${kettle(2)}<b>Уровень 2</b>Закипает</div>
      <div class="lv">${kettle(3)}<b>Уровень 3</b>Свистит!</div>
    </div>
    <button class="btn" onclick="go(0)">Поставить чайник <span class="arr">→</span></button>
    <div class="foot">Ответы видим только ты и я — ты сама решаешь, отправлять ли их мне</div>
  </div>`;
  window.scrollTo(0,0);
}

function go(n){ if (n < 0) return intro(); i = n; n >= Q.length ? result() : ask(); window.scrollTo(0,0); }

function ask(){
  const q = Q[i], v = A[q.id];
  const heat = i < Q.length/3 ? 1 : i < Q.length*2/3 ? 2 : 3;
  const deg = Math.round(20 + 80*i/Q.length);
  let body = '';
  if (q.type === 'text') {
    const val = esc(v || '');
    body = q.short
      ? `<input type="text" id="t" placeholder="${esc(q.ph||'')}" value="${val}" autocomplete="off">`
      : `<textarea id="t" placeholder="${esc(q.ph||'')}">${val}</textarea>`;
  } else {
    body = `<div class="opts ${q.grid?'grid':''}">${q.opts.map((o,k)=>{
      const on = q.type==='single' ? v===k : (v||[]).includes(k);
      return `<button class="opt ${q.type==='multi'?'multi':''} ${on?'on':''}" style="--k:${k}" onclick="pick(${k})"><span class="n">${pad(k+1)}</span><span class="t">${esc(o)}</span><span class="ck">${on?'✓':''}</span></button>`;
    }).join('')}</div>`;
    if (q.other) body += `<div class="other-label">Своё — напиши, если чего-то нет в списке</div><textarea id="other" placeholder="Хочу ещё…" style="min-height:80px">${esc(A[q.id+'_other']||'')}</textarea>`;
  }
  const needNext = q.type !== 'single';
  app.innerHTML = `<div class="screen">${head()}
    <div class="qhead">${kettle(heat === 3 ? 2 : heat)}<div class="bubble">${esc(q.tip||'')}</div></div>
    <div class="thermo"><div class="bar"><i style="width:${(i/Q.length)*100}%"></i></div><span>${deg}°</span></div>
    <div class="qnum">ВОПРОС ${i+1} ИЗ ${Q.length}</div>
    <h2>${esc(q.q)}</h2>
    ${q.hint?`<div class="hint">${esc(q.hint)}</div>`:''}
    ${body}
    <div class="nav">
      <button class="btn ghost" onclick="go(${i-1})">← Назад</button>
      ${needNext?`<button class="btn" id="next" onclick="next()">${i===Q.length-1?'Узнать результат':'Дальше'} <span class="arr">→</span></button>`:''}
    </div>
  </div>`;
  const t = document.getElementById('t');
  if (t) { t.focus(); t.oninput = check; t.onkeydown = e => { if (e.key==='Enter' && q.short) { e.preventDefault(); next(); } }; }
  const o = document.getElementById('other');
  if (o) o.oninput = () => { A[q.id+'_other'] = o.value; check(); };
  check();
}

function check(){
  const q = Q[i], b = document.getElementById('next'); if (!b) return;
  if (q.type === 'text') b.disabled = q.req && !document.getElementById('t').value.trim();
  if (q.type === 'multi') b.disabled = !(A[q.id]||[]).length && !(q.other && (A[q.id+'_other']||'').trim());
}

function pick(k){
  const q = Q[i];
  if (q.type === 'single') { A[q.id] = k; ask(); setTimeout(()=>go(i+1), 260); return; }
  let s = A[q.id] || [];
  const exclIdx = (q.excl||[]).map(e=>q.opts.indexOf(e));
  if (s.includes(k)) s = s.filter(x=>x!==k);
  else if (exclIdx.includes(k)) s = [k];
  else s = s.filter(x=>!exclIdx.includes(x)).concat(k);
  A[q.id] = s;
  const y = window.scrollY; ask(); window.scrollTo(0,y);
  document.querySelectorAll('.opt,.screen').forEach(el=>el.style.animation='none');
}

function next(){
  const q = Q[i];
  if (q.type === 'text') { const val = document.getElementById('t').value.trim(); if (q.req && !val) return; A[q.id] = val; }
  if (q.type === 'multi') { const b = document.getElementById('next'); if (b && b.disabled) return; }
  go(i+1);
}

function score(){
  const get = id => Q.find(q=>q.id===id);
  let s = 0;
  const nets = (A.nets||[]).map(k=>get('nets').opts[k]);
  if (nets.length && !nets.includes('Пока никакими')) s += (nets.length >= 2 || nets.includes('Claude')) ? 2 : 1;
  const use = (A.use||[]).map(k=>get('use').opts[k]);
  if (!use.includes('Пока ни для чего')) s += Math.min(2, ['Написать текст','Для соцсетей: посты, сторис, Reels','Картинки','Видео'].filter(x=>use.includes(x)).length);
  ['freq','memory','content','connect'].forEach(id=>{ const q=get(id); if (A[id]!=null) s += q.score[A[id]]; });
  return s <= 4 ? LEVELS[0] : s <= 9 ? LEVELS[1] : LEVELS[2];
}

function val(q){
  let v = A[q.id];
  if (q.type==='single') v = v!=null ? q.opts[v] : '—';
  else if (q.type==='multi') { v = (v||[]).map(x=>q.opts[x]); if (q.other && (A[q.id+'_other']||'').trim()) v.push('своё: '+A[q.id+'_other'].trim()); v = v.join(', ') || '—'; }
  else v = v || '—';
  return v;
}

function goalsList(){
  const gq = Q.find(q=>q.id==='goal');
  const g = (A.goal||[]).map(k=>gq.opts[k]);
  if ((A.goal_other||'').trim()) g.push(A.goal_other.trim());
  return g;
}

function advice(L){
  const r = [], goals = (A.goal||[]).map(k=>Q.find(q=>q.id==='goal').opts[k]);
  if (A.memory !== 2) r.push('Настроить личного нейромаркетолога, который знает твой бизнес, — чтобы не объяснять всё заново каждый раз');
  if (A.why === 0) r.push('Контент, который приводит клиентов: смыслы, прогрев и продающие сторис');
  if (A.post >= 2) r.push('Регулярность без выгорания: контент-план и поддержка, чтобы не сливаться');
  if (goals.some(g=>/карусел|Reels|посты/.test(g))) r.push('Практика по контенту с нейросетью: посты, карусели и монтаж Reels');
  if (goals.some(g=>/сайт|лид-магнит|бота|публикации/.test(g))) r.push('Настройка агента под ключ: сайт, лид-магнит, бот или автопубликация');
  if (!r.length) r.push(L.n === 3 ? 'Свой агент под задачи бизнеса' : 'Живой практикум с внедрением под твой уровень');
  return r.slice(0,4);
}

function answersText(L){
  const lines = [
    'Привет, Антонина! Я прошла нейро-тест.', '',
    `Имя: ${A.name||'—'}`, `Чем занимаюсь: ${A.job||'—'}`,
    `Мой результат: уровень ${L.n} «${L.name}» — ${L.title}`, '',
    'Что мне подойдёт:', ...L.fit.map(f=>'• '+f), '',
    'Рекомендации для меня:', ...advice(L).map(f=>'• '+f), ''
  ];
  const g = goalsList();
  if (g.length) lines.push('Хочу научиться:', ...g.map(f=>'• '+f), '');
  lines.push('— Мои ответы —');
  Q.forEach((q,k)=>{ if (q.id!=='name' && q.id!=='job') lines.push(`${k+1}. ${q.q}\n— ${val(q)}`); });
  return lines.join('\n').replace(/твой бизнес/g,'мой бизнес').replace(/твоему/g,'моему');
}

function result(){
  const L = score(), txt = answersText(L);
  const goals = goalsList();
  app.innerHTML = `<div class="screen">${head()}
    <div class="thermo"><div class="bar"><i style="width:100%"></i></div><span>100°</span></div>
    <div class="res-hero">
      ${kettle(L.heat)}
      ${L.n===3?'<div class="whoosh">фьють-фьють!</div>':''}
      <div><span class="badge">${esc(A.name||'')} · уровень ${L.n} «${L.name}»</span></div>
      <h1 style="font-size:clamp(44px,12vw,64px)"><em>${L.title}</em></h1>
    </div>
    <p class="lead" style="text-align:center;margin:12px 0 4px">${L.text}</p>
    <div class="card"><h3>Что тебе подойдёт</h3><ul>${L.fit.map(f=>`<li>${f}</li>`).join('')}</ul></div>
    <div class="card"><h3>Мои рекомендации для тебя</h3><ul>${advice(L).map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>
    ${goals.length?`<div class="card"><h3>Ты хочешь научиться</h3><div class="tags">${goals.map(g=>`<span>${esc(g)}</span>`).join('')}</div><p class="lead" style="font-size:15px">Всё это реально сделать с нейросетью. Я подскажу, с чего начать именно тебе.</p></div>`:''}
    <div class="card accent">
      <h3>Подберу программу именно для тебя</h3>
      <p class="lead" style="font-size:15px">Уровень — это только начало. По твоим ответам я пойму, что тебе важно, что отнимает время и что останавливает, — и предложу формат и программу под тебя.</p>
      <ul class="steps">
        <li>Нажми кнопку — ответы скопируются</li>
        <li>Откроется мой Telegram</li>
        <li>Вставь ответы в сообщение и отправь</li>
      </ul>
      <a class="btn" id="send" href="${TG}" target="_blank" rel="noopener">Отправить мне ответы <span class="arr">→</span></a>
      <div class="copied" id="copied"></div>
      <details><summary>Посмотреть, что отправится</summary><pre id="pre">${esc(txt)}</pre></details>
    </div>
    <button class="btn ghost" onclick="A={};intro()">Пройти заново</button>
    <div class="foot">Антонина Алдатова · маркетолог-смысловик<br><a href="${TG}" target="_blank" rel="noopener">@antonina_aldatova</a></div>
  </div>`;
  document.getElementById('send').onclick = () => {
    let ok = false;
    try { const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length); ok = document.execCommand('copy'); ta.remove(); } catch(e) {}
    try { if (navigator.clipboard) { navigator.clipboard.writeText(txt).catch(()=>{}); ok = true; } } catch(e) {}
    document.getElementById('copied').textContent = ok
      ? 'Ответы скопированы ✓ Вставь их в сообщение в Telegram'
      : 'Не получилось скопировать автоматически — открой «Посмотреть, что отправится» и скопируй текст вручную';
    if (!ok) document.querySelector('details').open = true;
  };
}

intro();
</script>
</body>
</html>
